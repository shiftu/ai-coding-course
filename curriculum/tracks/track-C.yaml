track: C
name: 资深
enter_when: 导师背书直升
# 只上公司特有模块 + 毕业项目。通用能力由背书导师负责。

modules:
  - id: m0-env
    name: 环境与网关
    kind: 公司特有
    exempt_test: 四条 --version 全部有输出，且 curl 网关 /v1/models 返回模型列表
    slices:
      - tool/env-setup
      - tool/gateway-connect
      - safety/gateway-not-public-domain
      - safety/key-storage
  - id: m1-map
    name: 工具全景与协作规范
    kind: 公司特有
    exempt_test: 说出三个入口各自的适用场景，并在 Gitea 建一个带 Issue 的 Milestone
    slices:
      - tool/toolchain-map
      - tool/pick-one-entry
      - tool/session-manage
      - tool/gitea-milestone
  - id: m3-hermes
    name: Hermes 数字员工
    kind: 公司特有
    exempt_test: 建 profile、让它记住一个偏好，新会话验证记忆生效
    slices:
      - tool/hermes-profile
      - tool/hermes-memory
      - automation/hermes-skills
      - tool/rollback-checkpoint
      - quality/subagent-selfreport
      - automation/delegate
  - id: m6-data
    name: 数据自助
    kind: 公司特有
    exempt_test: 查出昨日 DAU 并说清口径（事件定义 + 新老用户拆分逻辑）
    slices:
      - tool/query-product-data
      - tool/metric-definition-first
      - tool/cost-query
      - tool/data-has-lag
      - tool/trace-online-issue
  - id: m8-lark
    name: 飞书生态
    kind: 公司特有
    exempt_test: 用 lark-cli 建一份飞书文档并分享出去
    slices:
      - tool/lark-doc
      - tool/lark-bitable
      - tool/lark-meeting-summary
      - safety/lark-identity
      - tool/lark-doctor
  - id: m9-redline
    name: 工程红线
    kind: 公司特有
    exempt_test: 查出自己 team 的 7 天用量，并扫描仓库无密钥泄漏
    slices:
      - safety/budget-visible
      - safety/secret-scan
      - safety/redact-secrets
      - safety/approvals-mode
      - safety/audit-sessions
      - safety/data-boundary
      - safety/key-rotation
      - safety/model-cost-choice
  - id: capstone
    name: 毕业项目
    kind: 公司特有
    slices:
      - quality/capstone
